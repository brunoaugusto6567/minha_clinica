{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h1>Cadastro Médico</h1>

    <p class="subtitulo">
        Cadastro exclusivo para profissionais da clínica.
    </p>

    <form method="POST">

        <div class="form-group">

            <label>Nome Completo</label>

            <input
                type="text"
                name="nome"
                required>

        </div>

        <div class="form-group">

            <label>CRM</label>

            <input
                type="text"
                name="crm"
                required>

        </div>

        <div class="form-group">

            <label>Especialidade</label>

            <select name="especialidade">

                <option>Clínico Geral</option>
                <option>Cardiologia</option>
                <option>Dermatologia</option>
                <option>Ortopedia</option>
                <option>Pediatria</option>
                <option>Neurologia</option>
                <option>Ginecologia</option>

            </select>

        </div>

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                required>

        </div>

        <div class="form-group">

            <label>Senha</label>

            <input
                type="password"
                name="senha"
                required>

        </div>

        <div class="form-group">

            <label>Confirmar Senha</label>

            <input
                type="password"
                name="confirmar"
                required>

        </div>

        <button class="btn-submit">

            Cadastrar Médico

        </button>

    </form>

</div>

{% endblock %}
