{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2>Cadastro</h2>

    <form method="POST">

        <input
        type="text"
        name="nome"
        placeholder="Nome completo"
        required>

        <input
        type="email"
        name="email"
        placeholder="Email"
        required>

        <input
        type="text"
        name="telefone"
        placeholder="Telefone"
        required>

        <input
        type="password"
        name="senha"
        placeholder="Senha"
        required>

        <button type="submit">
            Cadastrar
        </button>

    </form>

</div>

{% endblock %}
