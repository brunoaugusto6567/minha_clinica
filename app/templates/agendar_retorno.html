{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Solicitar Consulta de Retorno</h2>

    <hr>

    <div class="card p-4">

        <form method="POST" action="{{ url_for('consulta.retorno', id=consulta.id) }}">

            <div class="mb-3">
                <label class="form-label"><strong>Paciente</strong></label>
                <input
                    type="text"
                    class="form-control"
                    value="{{ consulta.nome_completo }}"
                    disabled>
            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Especialidade</strong></label>
                <input
                    type="text"
                    class="form-control"
                    value="{{ consulta.especialidade }}"
                    disabled>
            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Consulta Anterior</strong></label>
                <input
                    type="text"
                    class="form-control"
                    value="{{ consulta.data }}"
                    disabled>
            </div>

            <hr>

            <div class="mb-3">

                <label class="form-label">
                    Data da Consulta
                </label>

                <input
                    type="date"
                    name="data"
                    class="form-control"
                    min="{{ today }}"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Horário
                </label>

                <select
                    name="horario"
                    class="form-select"
                    required>

                    <option value="">Selecione um horário</option>

                    {% for hora in range(8,19) %}
                        <option value="{{ '%02d:00' % hora }}">
                            {{ '%02d:00' % hora }}
                        </option>
                    {% endfor %}

                </select>

            </div>

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary">

                    📅 Solicitar Retorno

                </button>

                <a
                    href="{{ url_for('consulta.historico') }}"
                    class="btn btn-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
