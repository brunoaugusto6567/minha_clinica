{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h1>🏥 Agendamento de Consulta</h1>

    <form method="POST" class="consulta-form">

        <h2>Dados do Paciente</h2>

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" name="nome_completo" required>
        </div>

        <div class="form-group">
            <label>CPF</label>
            <input 
                type="text" 
                name="cpf" 
                id="cpf_input"
                maxlength="14" 
                placeholder="000.000.000-00" 
                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                title="Digite o CPF completo no formato 000.000.000-00"
                required
            >
        </div>

        <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="date" name="data_nascimento" required>
        </div>

        <div class="form-group">
            <label>Sexo</label>
            <select name="sexo" required>
                <option value="">Selecione</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
                <option value="Outro">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label>Telefone</label>
            <input 
                type="tel" 
                name="telefone" 
                id="telefone_input"
                maxlength="15" 
                placeholder="(85) 99999-9999" 
                pattern="\(\d{2}\)\s\d{5}-\d{4}"
                title="Digite o telefone completo com DDD no formato (85) 99999-9999"
                required
            >
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="seunome@gmail.com"
                required
            >
        </div>

        <div class="form-group">
            <label>Endereço</label>
            <input type="text" name="endereco" required>
        </div>

        <h2>Dados da Consulta</h2>

        <div class="form-group">
            <label>Especialidade</label>
            <select name="especialidade" required>
                <option value="">Selecione uma especialidade</option>
                {% for especialidade in especialidades %}
                <option value="{{ especialidade }}">
                    {{ especialidade }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Tipo de Consulta</label>
            <select name="tipo_consulta" required>
                <option value="Presencial">Presencial</option>
                <option value="Teleconsulta">Teleconsulta</option>
            </select>
        </div>

        <div class="form-group">
            <label>Data</label>
            <input type="date" name="data" id="data_consulta" required>
        </div>

        <div class="form-group">
            <label>Horário</label>
            <select name="horario" required>
                <option value="">Selecione um horário</option>
                <option value="08:00">08:00 AM</option>
                <option value="09:00">09:00 AM</option>
                <option value="10:00">10:00 AM</option>
                <option value="11:00">11:00 AM</option>
                <option value="12:00">12:00 PM</option>
                <option value="13:00">01:00 PM</option>
                <option value="14:00">02:00 PM</option>
                <option value="15:00">03:00 PM</option>
                <option value="16:00">04:00 PM</option>
                <option value="17:00">05:00 PM</option>
                <option value="18:00">06:00 PM</option>
            </select>
        </div>

        <button type="submit" class="btn-agendar">
            Confirmar Consulta
        </button>

    </form>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Bloqueio de datas passadas
        const dataInput = document.getElementById('data_consulta');
        if (dataInput) {
            const hoje = new Date().toISOString().split('T')[0];
            dataInput.min = hoje;
        }

        // Máscara viva para o CPF
        const cpfInput = document.getElementById('cpf_input');
        if (cpfInput) {
            cpfInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 3) value = value.substring(0,3) + '.' + value.substring(3);
                if (value.length > 7) value = value.substring(0,7) + '.' + value.substring(7);
                if (value.length > 11) value = value.substring(0,11) + '-' + value.substring(11,13);
                e.target.value = value;
            });
        }

        // CORREÇÃO: Máscara ajustada para celulares de 9 dígitos de forma dinâmica
        const telInput = document.getElementById('telefone_input');
        if (telInput) {
            telInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                
                if (value.length > 0) value = '(' + value;
                if (value.length > 3) value = value.substring(0,3) + ') ' + value.substring(3);
                
                // Aplica o hífen na posição correta se for celular de 9 dígitos (padrão nacional)
                if (value.length > 9) {
                    value = value.substring(0,10) + '-' + value.substring(10,14);
                } else if (value.length > 6) {
                    value = value.substring(0,9) + '-' + value.substring(9);
                }
                
                e.target.value = value;
            });
        }
    });
</script>

{% endblock %}
